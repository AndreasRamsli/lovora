name: lovora-hetzner

x-lovora-runtime: &lovora-runtime
  build:
    context: ../..
    dockerfile: deploy/hetzner/Dockerfile
    args:
      ARG_UID: ${UID:-1000}
      ARG_GID: ${GID:-1000}
  image: ${LOVORA_RUNTIME_IMAGE:-lovora-hetzner-runtime:latest}
  cap_add:
    - SYS_ADMIN
  env_file:
    - ./anythingllm.env
  environment:
    NODE_ENV: production
    ANYTHING_LLM_RUNTIME: docker
    STORAGE_DIR: /app/server/storage
    COLLECTOR_ENDPOINT: http://collector:8888
  volumes:
    - ./anythingllm.env:/app/server/.env
    - ${LOVORA_DATA_ROOT:-../../.data/hetzner}/server/storage:/app/server/storage
    - ${LOVORA_DATA_ROOT:-../../.data/hetzner}/collector/hotdir:/app/collector/hotdir
    - ${LOVORA_DATA_ROOT:-../../.data/hetzner}/collector/outputs:/app/collector/outputs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  restart: unless-stopped

services:
  server:
    <<: *lovora-runtime
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

  collector:
    <<: *lovora-runtime
    entrypoint: ["/bin/bash", "-lc"]
    command: ["cd /app/collector && exec node index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2.8
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - ./anythingllm.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
