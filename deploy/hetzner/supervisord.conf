[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:anythingllm]
command=/bin/bash -c "cd /app/server && export CHECKPOINT_DISABLE=1 && exec yarn start"
autostart=true
autorestart=true
user=anythingllm
stderr_logfile=/var/log/supervisor/anythingllm.err.log
stdout_logfile=/var/log/supervisor/anythingllm.out.log
environment=HOME="/home/anythingllm",USER="anythingllm"

[program:collector]
command=/bin/bash -c "cd /app/collector && exec node index.js"
autostart=true
autorestart=true
user=anythingllm
stderr_logfile=/var/log/supervisor/collector.err.log
stdout_logfile=/var/log/supervisor/collector.out.log
environment=HOME="/home/anythingllm",USER="anythingllm"
