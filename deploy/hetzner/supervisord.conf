[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:anythingllm]
command=/bin/bash -c "cd /app/server && export CHECKPOINT_DISABLE=1 && node ./scripts/sqlite-integrity-check.js --allow-missing && exec yarn start"
autostart=true
autorestart=true
user=anythingllm
stderr_logfile=/var/log/supervisor/anythingllm.err.log
stdout_logfile=/var/log/supervisor/anythingllm.out.log
environment=HOME="/home/anythingllm",USER="anythingllm"
