<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .pillar {
        fill-opacity: 0;
        stroke: #0A1128;
        stroke-width: 1.5;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawPillar 4s 1 forwards;
      }
      .top-block {
        fill-opacity: 0;
        stroke: #0A1128;
        stroke-width: 1.5;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawTop 4s 1 forwards;
      }
      .logo-text {
        opacity: 0;
        animation: textFade 4s 1 forwards;
      }

      @keyframes drawPillar {
        0% { stroke-dashoffset: 100; fill-opacity: 0; stroke-width: 1.5; opacity: 1; }
        20% { stroke-dashoffset: 0; fill-opacity: 0; stroke-width: 1.5; opacity: 1; }
        40%, 100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-width: 0; opacity: 1; }
      }

      @keyframes drawTop {
        0%, 15% { stroke-dashoffset: 100; fill-opacity: 0; stroke-width: 1.5; opacity: 1; }
        35% { stroke-dashoffset: 0; fill-opacity: 0; stroke-width: 1.5; opacity: 1; }
        50%, 100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-width: 0; opacity: 1; }
      }

      @keyframes textFade {
        0%, 40% { opacity: 0; }
        55%, 100% { opacity: 1; }
      }
    </style>
  </defs>
  <g transform="translate(60, -10) scale(1.1)" fill="#0A1128">
    <polygon class="top-block" pathLength="100" points="5,47 95,20 95,40 5,67" />
    <polygon class="top-block" pathLength="100" points="15,74 95,50 95,70 15,94" />
    <polygon class="pillar" pathLength="100" points="25,101 65,89 65,171 45,165 45,115 25,115" />
    <polygon class="pillar" pathLength="100" points="75,86 95,80 95,180 75,174" />
    <polygon class="top-block" pathLength="100" points="195,47 105,20 105,40 195,67" />
    <polygon class="top-block" pathLength="100" points="185,74 105,50 105,70 185,94" />
    <polygon class="pillar" pathLength="100" points="175,101 135,89 135,171 155,165 155,115 175,115" />
    <polygon class="pillar" pathLength="100" points="125,86 105,80 105,180 125,174" />
  </g>
  <text class="logo-text" x="330" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="600" letter-spacing="4" fill="#0A1128">LOVORA</text>
</svg>
